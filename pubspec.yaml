name: quizmind
description: "Biến tài liệu của bạn thành bài ôn tập với AI."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  file_picker: ^10.3.10
  image_picker: ^1.2.1
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.4
  audioplayers: ^6.8.1
  camera: ^0.12.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  camera_platform_interface: ^2.15.0

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/sample.txt
    - assets/robot.png
    - assets/audio/
